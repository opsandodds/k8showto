# CustomResourceDefinition extending the Kubernetes API with DatabaseCluster
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: databaseclusters.opsandodds.io
spec:
  group: opsandodds.io
  names:
    kind: DatabaseCluster
    listKind: DatabaseClusterList
    plural: databaseclusters
    singular: databasecluster
    shortNames:
    - dbc
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required:
            - replicas
            - engine
            properties:
              replicas:
                type: integer
                minimum: 1
                maximum: 10
              engine:
                type: string
                enum:
                - postgres
                - mysql
                - redis
              storageSize:
                type: string
                default: 10Gi
          status:
            type: object
            properties:
              phase:
                type: string
              readyReplicas:
                type: integer
    subresources:
      status: {}
