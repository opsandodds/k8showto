# WARNING: Never commit unencrypted Kubernetes Secrets (raw base64) to Git!
# Base64 is encoding, NOT encryption. Anyone with read access to Git can decode this secret.
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: shop
type: Opaque
stringData:
  DB_USER: "shop_admin"
  DB_PASS: "SuperSecretPassword123!"
