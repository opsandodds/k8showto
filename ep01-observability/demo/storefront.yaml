apiVersion: v1
kind: Namespace
metadata: {name: shop}
---
# frontend -> checkout -> payment  (payment throws 503s: the bug)
apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend, namespace: shop, labels: {app: frontend}}
spec:
  replicas: 1
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend}}
    spec:
      containers:
        - name: app
          image: storefront-demo:2
          imagePullPolicy: IfNotPresent
          env:
            - {name: ROLE, value: frontend}
            - {name: DOWNSTREAM, value: checkout}
            - {name: OTEL_SERVICE_NAME, value: frontend}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://tempo.observability:4317"}
            - {name: OTEL_EXPORTER_OTLP_PROTOCOL, value: grpc}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: checkout, namespace: shop, labels: {app: checkout}}
spec:
  replicas: 1
  selector: {matchLabels: {app: checkout}}
  template:
    metadata: {labels: {app: checkout}}
    spec:
      containers:
        - name: app
          image: storefront-demo:2
          imagePullPolicy: IfNotPresent
          env:
            - {name: ROLE, value: checkout}
            - {name: DOWNSTREAM, value: payment}
            - {name: OTEL_SERVICE_NAME, value: checkout}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://tempo.observability:4317"}
            - {name: OTEL_EXPORTER_OTLP_PROTOCOL, value: grpc}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: payment, namespace: shop, labels: {app: payment}}
spec:
  replicas: 1
  selector: {matchLabels: {app: payment}}
  template:
    metadata: {labels: {app: payment}}
    spec:
      containers:
        - name: app
          image: storefront-demo:2
          imagePullPolicy: IfNotPresent
          env:
            - {name: ROLE, value: payment}
            - {name: OTEL_SERVICE_NAME, value: payment}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://tempo.observability:4317"}
            - {name: OTEL_EXPORTER_OTLP_PROTOCOL, value: grpc}
---
apiVersion: v1
kind: Service
metadata: {name: frontend, namespace: shop}
spec: {selector: {app: frontend}, ports: [{port: 80, targetPort: 8080}]}
---
apiVersion: v1
kind: Service
metadata: {name: checkout, namespace: shop}
spec: {selector: {app: checkout}, ports: [{port: 80, targetPort: 8080}]}
---
apiVersion: v1
kind: Service
metadata: {name: payment, namespace: shop}
spec: {selector: {app: payment}, ports: [{port: 80, targetPort: 8080}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: loadgen, namespace: shop, labels: {app: loadgen}}
spec:
  replicas: 1
  selector: {matchLabels: {app: loadgen}}
  template:
    metadata: {labels: {app: loadgen}}
    spec:
      containers:
        - name: loadgen
          image: busybox:1.36
          command: ["/bin/sh","-c"]
          args: ["while true; do wget -q -O- http://frontend/ >/dev/null 2>&1; sleep 0.4; done"]
